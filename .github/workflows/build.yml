name: OrangeFox Build (split steps)

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: 'Branch OrangeFox'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
      clean_build:
        description: 'Hapus out/ sebelum build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: a02
      DEVICE_PATH: device/samsung/a02
      FOX_BRANCH: ${{ github.event.inputs.fox_branch }}
      ALLOW_MISSING_DEPENDENCIES: 'true'
      FOX_BUILD_DEVICE: a02
      LC_ALL: C

    steps:
      # ==========================================================
      # 0. Checkout device tree (repo ini) -> $GITHUB_WORKSPACE
      # ==========================================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Set variables (FOX_DIR, REPO_DIR)
        run: |
          echo "REPO_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "FOX_DIR=/home/runner/fox_${FOX_BRANCH}" >> "$GITHUB_ENV"
          echo "OUT_DIR=${GITHUB_WORKSPACE}/out" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # ==========================================================
      # 1. Setup environment (dependensi apt, repo tool)
      # ==========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 curl rsync python3 python3-pip zip unzip \
              bc bison build-essential ccache flex g++-multilib gcc-multilib \
              gnupg gperf lib32z1-dev libssl-dev libxml2-utils lzop pngcrush \
              squashfs-tools xsltproc zlib1g-dev liblz4-tool libncurses5 libtinfo5 \
              openjdk-8-jdk || true

      - name: Setup OrangeFox build env script
        run: |
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts "$HOME/fox_scripts"
          (cd "$HOME/fox_scripts" && sudo bash setup/android_build_env.sh) \
            || echo "WARN: android_build_env.sh gagal - lanjut, pakai paket apt di atas"

      - name: Setup repo tool + git identity
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "ofox-builder"
          git config --global user.email "ofox-builder@localhost"
          git config --global color.ui true

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ofox-${{ github.event.inputs.fox_branch }}-${{ github.sha }}
          restore-keys: |
            ccache-ofox-${{ github.event.inputs.fox_branch }}-

      # ==========================================================
      # 2. Sync source OrangeFox minimal manifest (dengan progress %)
      # ==========================================================
      - name: Sync OrangeFox source (repo sync)
        run: |
          mkdir -p "$HOME/OrangeFox_sync"
          cd "$HOME/OrangeFox_sync"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git
          cd sync

          set +o pipefail
          stdbuf -oL -eL ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_DIR" 2>&1 \
            | tee "$REPO_DIR/sync_full.log" \
            | stdbuf -oL tr '\r' '\n' \
            | stdbuf -oL grep --line-buffered -oE '[0-9]{1,3}% \([0-9]+/[0-9]+\)' \
            | awk '!seen[$0]++ { print "== sync: " $0 }'
          SYNC_RC=${PIPESTATUS[0]}
          set -o pipefail
          [ "$SYNC_RC" -eq 0 ] || { echo "ERROR: orangefox_sync.sh gagal (rc=$SYNC_RC)"; exit 1; }

      - name: Upload raw sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.event.inputs.fox_branch }}
          path: sync_full.log
          if-no-files-found: ignore

      # ==========================================================
      # 3. Pasang device tree (repo ini -> $FOX_DIR/device/samsung/a02)
      # ==========================================================
      - name: Install device tree into source
        run: |
          for f in prebuilt/Image prebuilt/dtb/dtb.dtb prebuilt/dtbo BoardConfig.mk twrp_a02.mk vendorsetup.sh; do
            [ -f "$REPO_DIR/$f" ] || { echo "ERROR: $f gak ada di tree"; exit 1; }
          done

          mkdir -p "$FOX_DIR/$DEVICE_PATH"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '_old' --exclude 'out' \
            --exclude 'ulti.sh' --exclude 'z' --exclude 'note.sh' --exclude 'fixlog.sh' \
            --exclude 'README.md' --exclude '.gitignore' \
            "$REPO_DIR/" "$FOX_DIR/$DEVICE_PATH/"
          echo "Device tree terpasang di $FOX_DIR/$DEVICE_PATH"

      # ==========================================================
      # 4. Fix ad-hoc (fixlog.sh) - di-append tiap ketemu fix baru
      # ==========================================================
      - name: Apply ad-hoc fixes (fixlog.sh)
        run: |
          cd "$FOX_DIR"
          if [ -f "$REPO_DIR/fixlog.sh" ]; then
            # shellcheck disable=SC1091
            source "$REPO_DIR/fixlog.sh"
          else
            echo "fixlog.sh gak ada - skip"
          fi

      # ==========================================================
      # 5. Build (envsetup + lunch + mka) - harus 1 step,
      #    soalnya env/function dari envsetup.sh cuma hidup
      #    di dalem satu shell process yang sama.
      # ==========================================================
      - name: Build (lunch + mka adbd recoveryimage)
        run: |
          cd "$FOX_DIR"
          if command -v ccache >/dev/null 2>&1; then
            export USE_CCACHE=1
            export CCACHE_EXEC="$(command -v ccache)"
            mkdir -p ~/.cache/ccache
            ccache -M 5G || true
          fi
          [ "${{ github.event.inputs.clean_build }}" = "true" ] && rm -rf "$FOX_DIR/out"

          set +e
          source build/envsetup.sh
          source "$DEVICE_PATH/vendorsetup.sh"
          lunch "twrp_${DEVICE}-eng"
          LUNCH_RC=$?
          set -e
          [ $LUNCH_RC -eq 0 ] || { echo "ERROR: lunch twrp_${DEVICE}-eng gagal"; exit 1; }

          mka adbd recoveryimage

      - name: Print ccache statistics
        if: always()
        run: ccache -s || true

      # ==========================================================
      # 6. Kumpulin hasil (recovery.img dll -> $OUT_DIR) + cek ukuran
      # ==========================================================
      - name: Collect build results
        run: |
          PRODUCT_OUT="$FOX_DIR/out/target/product/$DEVICE"
          mkdir -p "$OUT_DIR"
          cp -v "$PRODUCT_OUT/recovery.img" "$OUT_DIR/" 2>/dev/null || true
          cp -v "$PRODUCT_OUT"/OrangeFox* "$OUT_DIR/" 2>/dev/null || true
          cp -v "$PRODUCT_OUT"/*.tar "$OUT_DIR/" 2>/dev/null || true

          LIMIT=$(grep -oP 'BOARD_RECOVERYIMAGE_PARTITION_SIZE\s*:=\s*\K[0-9]+' "$REPO_DIR/BoardConfig.mk" | head -1)
          if [ -f "$PRODUCT_OUT/recovery.img" ] && [ -n "$LIMIT" ]; then
            SIZE=$(stat -c %s "$PRODUCT_OUT/recovery.img")
            echo "== recovery.img = $SIZE byte, batas partisi = $LIMIT byte"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "!! MELEBIHI partisi. Kurangi isi ramdisk (flag FOX_* diet di vendorsetup.sh)"
            fi
          fi
          echo "== SELESAI. Hasil ada di: $OUT_DIR"
          ls -la "$OUT_DIR"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-a02
          path: out/*
          if-no-files-found: error